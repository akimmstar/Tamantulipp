<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111c30">
  <title>Enjoy The Garden</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>

<body>
  <canvas id="c" aria-label="Taman malam dengan lebah dan tujuh belas tulip"></canvas>
  <header>
    <a class="back" href="index.html" aria-label="Kembali ke beranda">←</a>
    <h1>Taman <em>Tulip</em></h1>
    <button id="mus" aria-label="Putar piano" aria-pressed="false">♫</button>
  </header>
  <div id="hud"><span id="count" role="status"></span>
    <div id="dots" aria-hidden="true"></div>
  </div>
  <p id="hint">Ketuk bunga untuk mengambil nektar.</p>
  <div id="pad" aria-hidden="true"><span>⌃</span><span>›</span><span>⌄</span><span>‹</span>
    <div id="knob"></div>
  </div>
  <button id="eat" disabled><svg aria-hidden="true" viewBox="0 0 100 100">
      <circle id="ring" cx="50" cy="50" r="46" />
    </svg><span>Serap</span></button>
  <section id="card" hidden aria-labelledby="ending">
    <div>
      <h2 id="ending">Semua Tulip Telah Pulang</h2>
      <p id="quote"></p><button id="again">Mekar Lagi</button>
    </div>
  </section>
</body>

</html>
